name: npm audit fix (Node.js 22 with npm 10)

on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for creating PRs

      # Option 1: Build and run locally
      - name: Build and run npm-audit-fix Docker container
        run: |
          # Build the Docker image
          docker build -t npm-audit-fix .

          # Run the Docker container
          docker run -i --rm \
            -v ${{ github.workspace }}:/github/workspace \
            -w /github/workspace \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e GITHUB_ACTOR=${{ github.actor }} \
            -e GITHUB_SERVER_URL=${{ github.server_url }} \
            -e GITHUB_RUN_ID=${{ github.run_id }} \
            npm-audit-fix

      # Option 2: Use pre-built image (comment out Option 1 if using this)
      # - name: Run npm audit fix using pre-built image
      #   run: |
      #     docker run -i --rm \
      #       -v ${{ github.workspace }}:/github/workspace \
      #       -w /github/workspace \
      #       -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
      #       -e GITHUB_REPOSITORY=${{ github.repository }} \
      #       -e GITHUB_ACTOR=${{ github.actor }} \
      #       -e GITHUB_SERVER_URL=${{ github.server_url }} \
