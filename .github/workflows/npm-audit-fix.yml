on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: base64ai/npm-audit-fix-action@main
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}